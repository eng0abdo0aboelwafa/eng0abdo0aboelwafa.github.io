*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#f8fafc;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem}
.container{width:100%;max-width:600px}.header{text-align:center;margin-bottom:1.5rem}
.header h1{font-size:1.6rem;font-weight:800;color:#60a5fa;margin-bottom:.3rem}.header p{color:#94a3b8;font-size:.9rem}
.card{background:#1e293b;border-radius:16px;padding:1.5rem;border:1px solid #334155;box-shadow:0 15px 25px rgba(0,0,0,.3);margin-bottom:1.25rem}
.form-group{margin-bottom:1rem}label{display:block;margin-bottom:.4rem;font-weight:600;font-size:.9rem;color:#cbd5e1}
select,input[type=text]{width:100%;padding:.8rem 1rem;border-radius:10px;border:1.5px solid #475569;background:#0f172a;color:#f8fafc;font-size:.95rem;outline:none}
select:focus,input[type=text]:focus{border-color:#3b82f6}.results-box{display:flex;flex-direction:column;gap:.8rem}
.res-card{background:#1e293b;border-radius:12px;padding:1.25rem;border:1px solid #3b82f6}
.student-name{font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:.6rem;border-bottom:1px solid #334155;padding-bottom:.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.5rem}
.badge{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.5rem;text-align:center}
.badge.highlight{background:#1d4ed8;border-color:#3b82f6}.b-lbl{font-size:.7rem;color:#94a3b8;display:block}
.badge.highlight .b-lbl{color:#dbeafe}.b-val{font-size:1.1rem;font-weight:800;color:#38bdf8}
.badge.highlight .b-val{color:#fff;font-size:1.2rem}.not-found{text-align:center;color:#94a3b8;padding:1.2rem;background:#1e293b;border-radius:12px;border:1px dashed #475569;font-size:.9rem}
.info{text-align:center;color:#64748b;font-size:.75rem;margin-top:1rem}
</style>

function getSection(idx){
 const num=idx+18;
 if(num>=18&&num<=48)return{sec:"سكشن 1",num};
 if(num>=49&&num<=79)return{sec:"سكشن 2",num};
 if(num>=80&&num<=110)return{sec:"سكشن 3",num};
 if(num>=111&&num<=141)return{sec:"سكشن 4",num};
 if(num>=142&&num<=172)return{sec:"سكشن 5",num};
 if(num>=173&&num<=203)return{sec:"سكشن 6",num};
 if(num>=204&&num<=234)return{sec:"سكشن 7",num};
 if(num>=235&&num<=265)return{sec:"سكشن 8",num};
 if(num>=266&&num<=299)return{sec:"سكشن 9",num};
 return{sec:"خارج التقسيمة المحددة",num};
}
function clean(t){return t.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064B-\u065F]/g,'').trim().toLowerCase()}
const select=document.getElementById('courseSelect'),input=document.getElementById('nameInput'),results=document.getElementById('resultsArea');
for(const key in courses){const o=document.createElement('option');o.value=key;o.textContent=`${key} (${courses[key].length} طالب)`;select.appendChild(o)}
select.addEventListener('change',()=>{if(select.value){input.disabled=false;input.focus();search()}else{input.disabled=true;input.value='';results.innerHTML='<div class="not-found">اختر المادة واكتب اسمك للبحث</div>'}});
input.addEventListener('input',search);
function search(){
 const key=select.value,q=clean(input.value);if(!key)return;
 if(!q){results.innerHTML='<div class="not-found">اكتب اسم الطالب للبحث</div>';return}
 const matched=[];courses[key].forEach((name,idx)=>{if(clean(name).includes(q)){const s=getSection(idx);matched.push({name,sec:s.sec,num:s.num,order:idx+1})}});
 if(!matched.length){results.innerHTML='<div class="not-found">لم يتم العثور على اسم مطابق في هذه المادة</div>';return}
 results.innerHTML=matched.map(s=>`<div class="res-card"><div class="student-name">${s.name}</div><div class="grid"><div class="badge highlight"><span class="b-lbl">السكشن</span><span class="b-val">${s.sec}</span></div><div class="badge"><span class="b-lbl">الرقم المخصص</span><span class="b-val">${s.num}</span></div><div class="badge"><span class="b-lbl">ترتيب الكشف</span><span class="b-val">${s.order}</span></div></div></div>`).join('');
}
